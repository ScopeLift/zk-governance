name: ci

# The jobs that aren't specific to one l2-contracts project: the l1-contracts tests and the bytecode hash check, which
# builds both l1-contracts and l2-contracts. The l2-contracts and council projects have their own workflows.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

env:
  FOUNDRY_PROFILE: ci

# Every step has a timeout so a hung step fails instead of holding a runner until the 6-hour job limit.
jobs:
  l1-test:
    # The mainnet fork suites (RemoveGuardiansForkTest, MainnetRedeployForkTest) need `--fork-url` and are
    # reported as skipped here; run them locally with `forge test --fork-url <L1_MAINNET_RPC>`.
    defaults:
      run:
        working-directory: ./l1-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        timeout-minutes: 5
        with:
          submodules: true
          fetch-depth: 1

      - name: Install zksync-foundry
        timeout-minutes: 5
        uses: ./.github/actions/install-zksync-foundry

      - name: Install dependencies
        timeout-minutes: 10
        run: forge install

      - name: Build
        timeout-minutes: 15
        run: forge build

      - name: Run forge tests
        timeout-minutes: 15
        run: forge test

  hashes:
    # Rebuild both projects from source, recompute every contract's
    # bytecode hash, and fail the build if AllContractsHashes.json doesn't
    # match. Mirrors era-contracts' `calculate-hashes:check` so reviewers
    # can spot any unexpected bytecode drift across PRs without doing a
    # fresh build locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        timeout-minutes: 5
        with:
          submodules: true
          fetch-depth: 1

      - name: Install zksync-foundry
        timeout-minutes: 5
        uses: ./.github/actions/install-zksync-foundry

      - name: Install l1-contracts deps + build (EVM)
        timeout-minutes: 15
        working-directory: ./l1-contracts
        run: forge install && forge build

      - name: Install l2-contracts deps + build (EVM + zkSync)
        timeout-minutes: 30
        working-directory: ./l2-contracts
        run: forge install && npm install && npm run compile

      - name: Install root deps
        timeout-minutes: 10
        run: yarn install --frozen-lockfile

      - name: Check AllContractsHashes.json is up to date
        timeout-minutes: 10
        run: yarn calculate-hashes:check
