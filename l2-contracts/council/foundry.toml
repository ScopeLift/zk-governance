# The ZKsync Protocol Upgrade council governors, built on ScopeLift/council-governance.
#
# This is a separate Foundry project from the rest of l2-contracts because council-governance requires solc 0.8.30,
# OpenZeppelin v5 and the Cancun EVM version (OpenZeppelin v5.4 uses `mcopy`), while the existing contracts are pinned
# to solc 0.8.24, OpenZeppelin v4 and Paris. foundry-zksync applies one EVM version to a whole build and always writes
# artifacts to `<project root>/zkout`, so the two cannot share a project without changing existing bytecode or
# overwriting each other's artifacts. The contracts build from this project alone: council-governance is their only
# dependency, and OpenZeppelin v5 and forge-std come from council-governance's own submodules, the versions upstream
# builds and tests with. The fork smoke tests (`test/*.integration.t.sol`) also deploy the main project's OpenZeppelin
# v4 Supermajority Governor and override timelock from its build output, so run `forge build --skip test --skip script`
# and `forge build --zksync --skip test --skip script` in `l2-contracts` before running them.
#
# EraVM bytecode depends on the zksolc version. Build and deploy with foundry-zksync v0.1.10 (zksolc 1.5.15), the
# release the council workflow installs. zksolc isn't pinned here, because stock forge warns about the `zksync` section
# and scopelint then fails the formatting check.
[profile.default]
  auto_detect_remappings = false
  evm_version = "cancun"
  # The smoke tests deploy OpenZeppelin v4 contracts from the main l2-contracts project's EVM and EraVM artifacts.
  fs_permissions = [
    { access = "read", path = "../out" },
    { access = "read", path = "../zkout" },
  ]
  libs = ["lib"]
  optimizer = true
  optimizer_runs = 10_000_000
  remappings = [
    "@openzeppelin/contracts/=lib/council-governance/lib/openzeppelin-contracts/contracts/",
    "council-governance/=lib/council-governance/src/",
    "forge-std/=lib/council-governance/lib/forge-std/src/",
    # council-governance imports its own sources as `src/...`. This remapping applies only to files inside
    # council-governance, so those imports resolve to its `src/`, while this project's own `src/...` imports are
    # unaffected.
    "lib/council-governance/:src/=lib/council-governance/src/",
  ]
  solc_version = "0.8.30"
  verbosity = 3

# CI runs the council tests under --zksync, where every run executes in an emulated EraVM, so it keeps Foundry's default
# 256 fuzz runs rather than the main project's 2,500.
[profile.ci]

[profile.lite]
  fuzz = { runs = 50 }
  invariant = { runs = 10 }
  optimizer = false

# forge's built-in linter does not resolve the scoped remappings above and fails the build; scopelint is used instead.
[lint]
  lint_on_build = false

[fmt]
  bracket_spacing = false
  int_types = "long"
  line_length = 120
  multiline_func_header = "attributes_first"
  number_underscore = "thousands"
  quote_style = "double"
  single_line_statement_blocks = "multi"
  tab_width = 2
  wrap_comments = true
