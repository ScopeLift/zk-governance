[profile.default]
  # solc records every remapping in each contract's metadata, and the metadata hash is part of the bytecode. Remappings
  # are listed explicitly, rather than detected from lib/, so adding a dependency (such as council-governance, which
  # only the council project uses) leaves the bytecode of the existing contracts unchanged.
  auto_detect_remappings = false
  evm_version = "cancun"
  fs_permissions = [{ access = "read", path = "./zkout" }]
  fuzz = { runs = 50 }
  optimizer = true
  optimizer_runs = 10_000_000
  remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
    "@murky/=lib/murky/",
    # The set auto-detection produced from lib/ before council-governance was added.
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "erc4626-tests/=lib/openzeppelin-contracts-upgradeable/lib/erc4626-tests/",
    "flexible-voting/=lib/flexible-voting/",
    "forge-std/=lib/forge-std/src/",
    "murky/=lib/murky/",
    "openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "openzeppelin/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "solmate/=lib/flexible-voting/lib/solmate/src/",
  ]
  solc_version = "0.8.24"
  verbosity = 3

[profile.ci]
  fuzz = { runs = 2500 }
  invariant = { runs = 1000 }

[profile.lite]
  fuzz = { runs = 50 }
  invariant = { runs = 10 }
  # Speed up compilation and tests during development.
  optimizer = false

[fmt]
  bracket_spacing = false
  int_types = "long"
  line_length = 120
  multiline_func_header = "attributes_first"
  number_underscore = "thousands"
  quote_style = "double"
  single_line_statement_blocks = "multi"
  tab_width = 2
  wrap_comments = true

[rpc_endpoints]
  zksync = "${ZKSYNC_RPC_URL}"

# The newest zksolc the Era explorer verifies; the governors redeployed for the Guardians removal are built with it.
[profile.default.zksync]
  zksolc = "1.5.17"
